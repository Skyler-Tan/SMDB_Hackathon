server:
  port: 8080

spring:
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/threer}

  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 8MB

threer:
  default-user-id: local-user

groq:
  api-key: ${groq-api-key}

tavily:
  api-key: ${tav}

locationiq:
  api-key: ${locationiq-apikey}
