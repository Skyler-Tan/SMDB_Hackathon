server:
  port: 8080

spring:
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/threer}

  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 8MB

threer:
  default-user-id: local-user

huggingface:
  api-key: ${HF_API_KEY:}

tavily:
  api-key: ${TAVILY_API_KEY:}

ocr:
  url: ${OCR_URL:http://localhost:8000/ocr}
